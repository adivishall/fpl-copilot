# CI contract (§78): lint + format + types + layering, unit/integration/property tests with real
# PostgreSQL + Redis, optimizer validity suite, a bounded backtest smoke (tests/integration/
# test_backtest.py: four gameweeks on the fixture excerpt, inside the test job), migration
# validation, container builds, dependency + secret scanning. Deployment (deploy.yml) runs only from a green main.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy packages services apps/api/src apps/worker/src
      - name: architecture layering (import-linter)
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpl
          POSTGRES_PASSWORD: fpl
          POSTGRES_DB: fpl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fpl" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FPL_TEST_DATABASE_URL: postgresql+psycopg://fpl:fpl@localhost:5432/fpl_test
      FPL_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: migration validation (upgrade → downgrade → upgrade, no drift)
        run: uv run pytest tests/integration/test_migrations.py -q
      - name: runner numerics (which CPU and SIMD paths computed this run)
        run: |
          lscpu | grep -E "Model name|Flags" | cut -c1-160
          uv run python -c "import numpy; numpy.show_runtime()"
      - name: unit + property + integration + data-quality tests
        env:
          # golden parity (tests/integration/test_golden_parity.py) is byte-exact only on the
          # platform that produced the golden; shared x86_64 runners differ from each other
          # (BUILD_STATUS §2d defect 52), so the test skips here and its package is uploaded
          FPL_GOLDEN_ACTUAL: golden-package/recommendation_package.linux-x86_64.json
        run: uv run pytest -q -m "not slow and not network" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-package-linux-x86_64
          path: golden-package/
          if-no-files-found: ignore

  optimizer-suite:
    # Exhaustive brute-force verification of the MILP (incl. slow Free Hit what-if cases) and
    # the independent validator on real forecasts (§36, §61, ADR-0007).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: MILP vs brute force, lineup solver, initial squad, validator
        run: uv run pytest -q tests/unit/optimizer tests/unit/simulation/test_lineup_eval.py
      - name: optimiser + decision engine on real forecasts
        run: uv run pytest -q tests/integration/test_optimizer_real_data.py tests/integration/test_decision_real_data.py

  web-e2e:
    # Next.js typecheck + production build, then Playwright flows against the real API stack
    # (fixture snapshot + PostgreSQL service + migrations) — §70.2 e2e, §73.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpl
          POSTGRES_PASSWORD: fpl
          POSTGRES_DB: fpl_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fpl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FPL_E2E_DATABASE_URL: postgresql+psycopg://fpl:fpl@localhost:5432/fpl_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci && npm run typecheck && npm run test:unit && npm run build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: dependency audit (python)
        run: |
          uv export --frozen --no-hashes --no-emit-workspace --no-dev > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off
      - name: secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          push: false
          tags: fpl-engine:ci
      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: fpl-web:ci
